<!doctype html>
<!--
  Initialize the default language to English to meet a11y requirements,
  it will be subsequently updated by the setLocale action.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <!-- Note: title should be supplied/injected via config.yml -->
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <!-- Theme color for PWA -->
    <meta name="theme-color" content="#0055a4">
    <!-- Apple Touch Icon (for iOS) -->
    <link rel="apple-touch-icon" href="/icon-192x192.png">
    <!-- PWA app name for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Transit Paris">
    <!-- Description for PWA -->
    <meta name="description" content="Planifiez vos trajets avec Transit Paris">

    <link href="https://fonts.googleapis.com/css?family=Hind:300,400,500,600,700" rel="stylesheet">
    <title>Transit Paris</title>
  </head>
  <body>
    <div id="main"></div>
    <!-- PWA: Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful');
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
